services:
  - type: web
    name: cjc-portfolio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Christopher John Cruz
      - key: CONTACT_OWNER_EMAIL
        value: cruchristopherjohnhoylar@gmail.com
