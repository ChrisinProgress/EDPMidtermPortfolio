ServerName 127.0.0.1
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100

# Keep prefork memory use suitable for a small portfolio web service.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    MaxRequestWorkers 10
    MaxConnectionsPerChild 1000
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    # Render terminates TLS before forwarding HTTP to Apache. This makes PHP's
    # existing HTTPS detection set Secure on the contact session cookie.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>

    # These PHP templates/data must be readable by PHP includes, never over HTTP.
    <DirectoryMatch "^/var/www/html/(config|data|includes|pages)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(^\.|\.(?:env|ini|log|sql|bak|backup|key|pem|sh|ps1)$)">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
    <Directory /var/www/html/assets>
        ExpiresActive On
        ExpiresDefault "access plus 1 hour"
        ExpiresByType font/woff2 "access plus 30 days"
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
