<svg xmlns="http://www.w3.org/2000/svg" width="480" height="530" viewBox="0 0 480 530" role="img" aria-labelledby="title desc">
<title id="title">Profile photograph placeholder</title><desc id="desc">An abstract person silhouette on a pale blue and violet background, labeled Your photo here. Replace this local SVG with your own photograph.</desc>
